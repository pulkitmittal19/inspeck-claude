<!doctype html><html><head><meta charset="utf-8"><script src="/__dev/tables/shim.js"></script><title>Design systems</title>
<!-- systems/<ds>.js: one design system's real components, bundled with esbuild (not committed: build.mjs builds it) -->
<script>
  const ds = new URLSearchParams(location.search).get('ds') ?? 'shadcn'
  document.title = `Design system: ${ds}`
  if (ds === 'shadcn') document.write('<script src="https://cdn.tailwindcss.com/3.4.4"><\/script>')
  document.write(`<link rel="stylesheet" href="systems/${ds}.css" onerror="this.remove()">`)
</script>
</head><body><div id="root"></div>
<script>document.write(`<script src="systems/${ds}.js"><\/script>`)</script>
<script src="/inspeck.js"></script></body></html>
