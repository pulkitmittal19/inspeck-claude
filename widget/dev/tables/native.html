<!doctype html><html><head><meta charset="utf-8"><script src="/__dev/tables/shim.js"></script><title>Native tables</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<script src="data.js"></script>
<style> .scroll { max-height: 220px; overflow: auto; } .scroll thead th { position: sticky; top: 0; background: #fff; } td.clip { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } </style>
</head><body>
<h6>Bootstrap table, icon fonts (Bootstrap Icons, Material Icons), checkboxes, sticky header</h6>
<div class="scroll"><table class="table table-hover align-middle" id="t1"><thead><tr><th><input type="checkbox" class="form-check-input"></th><th>Name</th><th>Email</th><th>Status</th><th>Plan</th><th class="text-end">Amount</th><th>Tags</th><th></th></tr></thead><tbody></tbody></table></div>
<script>
  document.querySelector('#t1 tbody').innerHTML = ROWS.map(r => `<tr><td><input type="checkbox" class="form-check-input"></td><td class="clip">${cells.who(r)}</td><td>${cells.email(r)}</td><td><span class="badge ${r.status}">${r.status}</span></td><td>${r.plan}</td><td class="text-end">${r.amount}</td><td>${cells.tags(r)}</td><td><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-link"><span class="material-icons" style="font-size:18px">delete</span></button></td></tr>`).join('')
</script>
<h6 class="mt-4">Server-rendered style: links that are whole rows, text straight in cells</h6>
<table class="table" id="t2"><tbody></tbody></table>
<script>
  document.querySelector('#t2 tbody').innerHTML = ROWS.map(r => `<tr onclick="void 0" style="cursor:pointer"><td>${r.name}</td><td>${r.plan}</td><td>${r.date}</td><td><a href="#${r.id}">View <i class="bi bi-chevron-right"></i></a></td></tr>`).join('')
</script>
<h6 class="mt-4">CSS grid of divs, a row that is one link</h6>
<div id="g" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border:1px solid #ddd"></div>
<script>
  document.getElementById('g').innerHTML = ROWS.map(r => `<a href="#r${r.id}" style="display:contents;color:inherit;text-decoration:none"><div style="padding:10px">${cells.who(r)}</div><div style="padding:10px">${cells.status(r)}</div><div style="padding:10px">${r.amount}</div><div style="padding:10px">${r.date}</div></a>`).join('')
</script>
<script src="/inspeck.js"></script>
</body></html>
