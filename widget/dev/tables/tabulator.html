<!doctype html><html><head><meta charset="utf-8"><script src="/__dev/tables/shim.js"></script><title>Tabulator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.1/dist/css/tabulator.min.css">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
<script src="data.js"></script></head><body>
<div id="t" style="width:1100px"></div>
<script>
  new Tabulator('#t', { data: ROWS, layout: 'fitColumns', columns: [
    { formatter: 'rowSelection', titleFormatter: 'rowSelection', width: 40, headerSort: false },
    { title: 'Name', field: 'name', formatter: c => cells.who(c.getRow().getData()), width: 260 },
    { title: 'Email', field: 'email', formatter: c => cells.email(c.getRow().getData()) },
    { title: 'Status', field: 'status', formatter: c => cells.status(c.getRow().getData()) },
    { title: 'Plan', field: 'plan' }, { title: 'Amount', field: 'amount', hozAlign: 'right' },
    { title: 'Tags', field: 'tags', formatter: c => cells.tags(c.getRow().getData()) },
    { title: '', formatter: () => cells.actions(), headerSort: false, width: 100 },
  ] })
</script>
<script src="/inspeck.js"></script></body></html>
