<!doctype html><html><head><meta charset="utf-8"><script src="/__dev/tables/shim.js"></script><title>AG Grid</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="data.js"></script></head><body>
<div id="grid" class="ag-theme-quartz" style="height:360px;width:1100px"></div>
<script>
  const html = f => p => { const d = document.createElement('div'); d.innerHTML = f(p.data); return d.firstElementChild ?? d }
  agGrid.createGrid(document.getElementById('grid'), {
    rowData: ROWS, rowSelection: 'multiple',
    columnDefs: [
      { field: 'name', checkboxSelection: true, headerCheckboxSelection: true, cellRenderer: html(cells.who), width: 260 },
      { field: 'email', cellRenderer: html(cells.email), width: 220 },
      { field: 'status', cellRenderer: html(cells.status), width: 120 },
      { field: 'plan', width: 110 }, { field: 'amount', type: 'rightAligned', width: 130 },
      { field: 'tags', cellRenderer: p => { const s = document.createElement('span'); s.innerHTML = cells.tags(p.data); return s }, width: 160 },
      { headerName: '', cellRenderer: () => { const s = document.createElement('span'); s.innerHTML = cells.actions(); return s }, width: 100 },
    ],
  })
</script>
<script src="/inspeck.js"></script></body></html>
